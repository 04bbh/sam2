qwen:
  model_path: "Qwen3-VL-8B-Instruct"
  max_new_tokens: 256

sam2:
  model_cfg: "configs/sam2.1/sam2.1_hiera_l.yaml"
  checkpoint: "./checkpoints/sam2.1_hiera_large.pt"
  multimask_output: false
  # Keep long-video frames/states in CPU RAM to avoid GPU OOM during tracking.
  # This is slower, but much safer for 2k+ frame videos on a 24GB GPU.
  offload_video_to_cpu: true
  offload_state_to_cpu: true
  async_loading_frames: false

selector:
  alpha: 0.9
  beta: 0.1
  min_score: 0.6
  top_k_frames: 1
  max_targets_per_frame: 2
  count_bonus: 0.03
  min_frame_gap: 30
  merge_iou_thresh: 0.8

candidate_selector:
  high_ratio: 0.3
  mid_ratio: 0.1
  low_ratio: 0.1
  uniform_interval: 0

pipeline:
  batch_size: 4
  queue_size: 32
  visualize_detector: true

data:
  dataset_name: "ucf"
  candidate_stride: 8     #sht：5  ubn:2   ucf：8
  video_desc_root: ""
  videos_root: "/data/users/wjq/datasets/UCF-Crime/frames"
  # "/data/users/wjq/datasets/shanghaitech/testing/frames"
  output_root: "./output_vis/output_loc_ucf/improved_2"
  track_txt_root: "./output_tracks/output_tracks_ucf/improved_2"
  detector_stage2_vis_root: "./output_vis/output_loc_ucf/detector_stage2_vis_10"
  detector_stage2_json_root: "./output_detector_json/output_json_detector_ucf/detector_stage2_json_10" 
  ann_obj_id: 1
  
